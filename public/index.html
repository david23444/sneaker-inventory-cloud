<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sneaker Inventory Cloud</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="container">

    <header class="header">
      <div class="hero-text">
        <h1>Sneaker Inventory Cloud</h1>
        <p class="subtitle">Tu stock de zapatillas, siempre al día y en la nube.</p>
        <span class="badge"><i class="dot"></i> Cloud live</span>
      </div>
      <div class="hero-shoe" aria-hidden="true">
        <svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg">
          <ellipse cx="62" cy="57" rx="48" ry="2.6" fill="#000" opacity=".35"/>
          <path d="M6 44h106q4 0 4 4v2q0 5-6 5H14q-8 0-8-6z" fill="#f1f5f9"/>
          <path d="M8 47h108" stroke="#cbd5e1" stroke-width="1.2"/>
          <path d="M10 44V30q0-4 4-5l16-3q6-2 10-8l6-6q4-2 8 1l4 5q6 6 18 10 20 4 32 14 4 3 4 6z" fill="var(--accent)"/>
          <path d="M18 41q32-2 64-14" stroke="#04120b" stroke-width="3" fill="none" stroke-linecap="round" opacity=".85"/>
          <path d="M44 14l9 6M49 10l9 7M54 8l9 7" stroke="#04120b" stroke-width="2" stroke-linecap="round" opacity=".6"/>
          <path d="M10 36q10-1 20-5" stroke="#fff" stroke-width="1.5" fill="none" opacity=".5"/>
        </svg>
      </div>
    </header>

    <section class="stats" aria-label="Resumen del inventario">
      <div class="stat"><span class="stat-num" id="statModelos">0</span><span class="stat-label">Modelos</span></div>
      <div class="stat"><span class="stat-num" id="statPares">0</span><span class="stat-label">Pares en stock</span></div>
      <div class="stat"><span class="stat-num" id="statBajo">0</span><span class="stat-label">Stock bajo (≤ 3)</span></div>
    </section>

    <section class="card">
      <h2>Registrar zapatilla</h2>
      <form id="formZapatilla" class="grid-form" autocomplete="off">

        <div class="field">
          <label for="_id">ID <small>(automático)</small></label>
          <input type="number" id="_id" name="_id" readonly tabindex="-1" class="auto" />
        </div>

        <div class="field">
          <label for="marcaSelect">Marca</label>
          <select id="marcaSelect" required></select>
          <input type="text" id="marcaOtra" placeholder="Escribe la marca" hidden />
          <input type="hidden" id="marca" name="marca" />
        </div>

        <div class="field combo">
          <label for="modelo">Modelo</label>
          <input type="text" id="modelo" name="modelo" placeholder="Escribe: air, jordan, dunk…" required
                 role="combobox" aria-expanded="false" aria-controls="sugerencias" />
          <ul id="sugerencias" class="suggest" role="listbox" hidden></ul>
        </div>

        <div class="field">
          <label for="talla">Talla</label>
          <input type="number" step="0.5" min="30" max="52" id="talla" name="talla" placeholder="42" required />
        </div>

        <div class="field">
          <label for="precio">Precio</label>
          <input type="number" step="0.01" min="0" id="precio" name="precio" placeholder="650" required />
        </div>

        <div class="field">
          <label for="stock">Stock</label>
          <input type="number" min="0" id="stock" name="stock" placeholder="10" required />
        </div>

        <div class="field full">
          <label id="lblEtiquetas">Etiquetas <small>(toca para activar o quitar)</small></label>
          <div id="chips" class="chips" role="group" aria-labelledby="lblEtiquetas"></div>
          <input type="hidden" id="etiquetas" name="etiquetas" />
        </div>

        <div class="field full">
          <label>Foto del calzado <small>(opcional)</small></label>
          <div class="foto-box">
            <div class="foto-prev" id="fotoPrev"></div>
            <div class="foto-btns">
              <label class="btn btn-secondary" for="fotoFile">Subir foto</label>
              <button type="button" class="btn btn-ghost" id="btnQuitarFoto" hidden>Quitar</button>
            </div>
            <input type="file" id="fotoFile" accept="image/*" hidden />
          </div>
          <input type="hidden" id="foto" name="foto" />
        </div>

        <div class="actions full">
          <button type="submit" class="btn btn-primary">Guardar en Atlas</button>
          <button type="reset" class="btn btn-secondary" id="btnReset">Limpiar</button>
        </div>
      </form>
      <p id="mensaje" class="mensaje" aria-live="polite"></p>
    </section>

    <section class="card">
      <div class="toolbar">
        <h2>Inventario</h2>
        <div class="search-box">
          <input type="search" id="buscarInput" placeholder="Buscar por modelo…" />
          <select id="filtroMarca" aria-label="Filtrar por marca"><option value="">Todas las marcas</option></select>
        </div>
      </div>

      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th><th>Modelo</th><th>Marca</th><th>Talla</th>
              <th>Precio</th><th>Stock</th><th>Etiquetas</th><th></th>
            </tr>
          </thead>
          <tbody id="tablaZapatillas">
            <tr><td colspan="8" class="empty">Cargando inventario…</td></tr>
          </tbody>
        </table>
      </div>
    </section>
  </div>

  <dialog id="dlgEditar">
    <form method="dialog" id="formEditar" class="dlg">
      <h3>Editar zapatilla</h3>
      <p class="dlg-sub" id="dlgNombre"></p>
      <div class="field"><label for="editPrecio">Precio</label><input type="number" step="0.01" min="0" id="editPrecio" required /></div>
      <div class="field"><label for="editStock">Stock</label><input type="number" min="0" id="editStock" required /></div>
      <div class="field">
        <label>Foto</label>
        <div class="foto-box">
          <div class="foto-prev" id="editFotoPrev"></div>
          <label class="btn btn-secondary" for="editFotoFile">Cambiar foto</label>
          <input type="file" id="editFotoFile" accept="image/*" hidden />
        </div>
      </div>
      <div class="actions">
        <button type="submit" class="btn btn-primary">Guardar cambios</button>
        <button type="button" class="btn btn-secondary" data-cerrar>Cancelar</button>
      </div>
    </form>
  </dialog>

  <dialog id="dlgEliminar">
    <form method="dialog" class="dlg">
      <h3>Eliminar zapatilla</h3>
      <p class="dlg-sub" id="delNombre"></p>
      <div class="actions">
        <button type="submit" class="btn btn-del" id="btnConfirmDel">Eliminar</button>
        <button type="button" class="btn btn-secondary" data-cerrar>Cancelar</button>
      </div>
    </form>
  </dialog>

  <script>
    const API = '/api/zapatillas';

    // ---------- Catálogo por defecto (editable) ----------
    const BASE = {
      'Nike': ['Air Max 90', 'Air Max 97', 'Air Force 1 Low', 'Air Force 1 Mid', 'Dunk Low Panda', 'Dunk High', 'Pegasus 41', 'Vomero 5', 'Cortez', 'Blazer Mid 77'],
      'Jordan': ['Air Jordan 1 Mid', 'Air Jordan 1 High OG', 'Air Jordan 1 Low', 'Air Jordan 2 Black', 'Air Jordan 3 White Cement', 'Air Jordan 4 Retro', 'Air Jordan 5', 'Air Jordan 11 Retro', 'Air Jordan 12'],
      'Adidas': ['Samba OG', 'Gazelle', 'Campus 00s', 'Superstar', 'Stan Smith', 'Forum Low', 'Ultraboost Light', 'Handball Spezial', 'Yeezy Boost 350'],
      'Puma': ['Suede Classic', 'Speedcat', 'RS-X', 'Palermo', 'Clyde', 'Deviate Nitro'],
      'New Balance': ['550', '574', '990v6', '2002R', '9060', '530', 'Fresh Foam 1080'],
      'Converse': ['Chuck Taylor All Star', 'Chuck 70 High', 'One Star', 'Run Star Hike'],
      'Vans': ['Old Skool', 'Sk8-Hi', 'Authentic', 'Knu Skool', 'Slip-On'],
      'Reebok': ['Club C 85', 'Classic Leather', 'Question Mid', 'Instapump Fury'],
      'Asics': ['Gel-Kayano 14', 'Gel-1130', 'Gel-Nimbus 26', 'Gel-Lyte III'],
      'Otra': []
    };
    // Nombre completo: "New Balance 530", "Nike Air Max 90", etc.
    const CATALOGO = Object.fromEntries(Object.entries(BASE).map(([marca, lista]) => [
      marca,
      lista.map(n => (marca === 'Jordan' || n.startsWith(marca)) ? n : `${marca} ${n}`)
    ]));
    const COLORES = { 'Nike': '#ff7a45', 'Jordan': '#ef4444', 'Adidas': '#3b82f6', 'Puma': '#eab308', 'New Balance': '#94a3b8',
      'Converse': '#e5e7eb', 'Vans': '#a855f7', 'Reebok': '#22d3ee', 'Asics': '#35f0a0' };
    function zapatoSVG(marca) {
      const c = COLORES[marca] || '#64748b';
      return `<svg viewBox="0 0 120 60" xmlns="http://www.w3.org/2000/svg"><path d="M6 44h106q4 0 4 4v2q0 5-6 5H14q-8 0-8-6z" fill="#f1f5f9"/><path d="M10 44V30q0-4 4-5l16-3q6-2 10-8l6-6q4-2 8 1l4 5q6 6 18 10 20 4 32 14 4 3 4 6z" fill="${c}"/><path d="M18 41q32-2 64-14" stroke="#0a0d12" stroke-width="3" fill="none" stroke-linecap="round" opacity=".7"/></svg>`;
    }
    const MARCAS = Object.keys(CATALOGO);
    const ETIQUETAS = ['urbano', 'deportivo', 'running', 'básquet', 'retro', 'edición limitada', 'casual', 'skate', 'lifestyle', 'premium', 'nuevo', 'oferta'];

    const $ = (id) => document.getElementById(id);
    const form = $('formZapatilla'), tbody = $('tablaZapatillas'), mensaje = $('mensaje');
    const buscarInput = $('buscarInput'), filtroMarca = $('filtroMarca');
    const marcaSelect = $('marcaSelect'), marcaOtra = $('marcaOtra'), marcaHidden = $('marca');
    const modeloInput = $('modelo'), lista = $('sugerencias');
    const chipsBox = $('chips'), etiquetasHidden = $('etiquetas');

    let inventario = [];     // todo lo que hay en la BD
    let seleccion = new Set();
    let idActivo = null;     // para editar / eliminar
    let sugActiva = -1;

    const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

    function toast(texto, error = false) {
      mensaje.textContent = texto;
      mensaje.className = 'mensaje ' + (error ? 'error' : 'ok');
      clearTimeout(toast.t);
      toast.t = setTimeout(() => { mensaje.textContent = ''; mensaje.className = 'mensaje'; }, 4000);
    }

    // ---------- Marca ----------
    function initMarcas() {
      marcaSelect.innerHTML = '<option value="" disabled selected>Elige una marca</option>' +
        MARCAS.map(m => `<option value="${esc(m)}">${m === 'Otra' ? 'Otra marca…' : esc(m)}</option>`).join('');
      filtroMarca.innerHTML = '<option value="">Todas las marcas</option>' +
        MARCAS.filter(m => m !== 'Otra').map(m => `<option>${esc(m)}</option>`).join('');
    }
    function setMarca(valor) {
      const conocida = MARCAS.includes(valor) && valor !== 'Otra';
      marcaSelect.value = conocida ? valor : (valor ? 'Otra' : '');
      marcaOtra.hidden = conocida || !valor;
      marcaOtra.value = conocida ? '' : valor;
      marcaOtra.required = !marcaOtra.hidden;
      marcaHidden.value = valor || '';
    }
    marcaSelect.addEventListener('change', () => {
      if (marcaSelect.value === 'Otra') {
        marcaOtra.hidden = false; marcaOtra.required = true; marcaOtra.focus(); marcaHidden.value = marcaOtra.value;
      } else {
        marcaOtra.hidden = true; marcaOtra.required = false; marcaHidden.value = marcaSelect.value;
      }
      mostrarSugerencias();
    });
    marcaOtra.addEventListener('input', () => { marcaHidden.value = marcaOtra.value.trim(); });

    // ---------- Autocompletado de modelo ----------
    function todosLosModelos() {
      const mapa = new Map();
      for (const [marca, modelos] of Object.entries(CATALOGO))
        modelos.forEach(m => mapa.set(m.toLowerCase(), { modelo: m, marca, enBD: false }));
      inventario.forEach(z => {
        const marca = z.detalles?.marca ?? '';
        mapa.set(String(z.modelo).toLowerCase(), { modelo: z.modelo, marca, enBD: true });
      });
      return [...mapa.values()];
    }
    function mostrarSugerencias() {
      const q = modeloInput.value.trim().toLowerCase();
      const marcaSel = marcaHidden.value;
      let items = todosLosModelos().filter(it => q ? it.modelo.toLowerCase().includes(q) : (!marcaSel || it.marca === marcaSel));
      items.sort((a, b) =>
        (b.marca === marcaSel) - (a.marca === marcaSel) ||
        (b.modelo.toLowerCase().startsWith(q)) - (a.modelo.toLowerCase().startsWith(q)) ||
        a.modelo.localeCompare(b.modelo));
      items = items.slice(0, 40);
      sugActiva = -1;
      if (!items.length) { cerrarSugerencias(); return; }
      lista.innerHTML = items.map((it, i) => `
        <li role="option" data-i="${i}" data-modelo="${esc(it.modelo)}" data-marca="${esc(it.marca)}">
          <span>${esc(it.modelo)}</span>
          <small>${esc(it.marca)}${it.enBD ? ' · ya registrado' : ''}</small>
        </li>`).join('');
      lista.hidden = false;
      modeloInput.setAttribute('aria-expanded', 'true');
    }
    function cerrarSugerencias() { lista.hidden = true; modeloInput.setAttribute('aria-expanded', 'false'); }
    function elegirSugerencia(li) {
      modeloInput.value = li.dataset.modelo;
      if (li.dataset.marca) setMarca(li.dataset.marca);
      cerrarSugerencias();
      $('talla').focus();
    }
    modeloInput.addEventListener('input', mostrarSugerencias);
    modeloInput.addEventListener('focus', mostrarSugerencias);
    modeloInput.addEventListener('keydown', (e) => {
      const lis = [...lista.children];
      if (lista.hidden || !lis.length) return;
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
        e.preventDefault();
        sugActiva = (sugActiva + (e.key === 'ArrowDown' ? 1 : -1) + lis.length) % lis.length;
        lis.forEach((li, i) => li.classList.toggle('active', i === sugActiva));
      } else if (e.key === 'Enter' && sugActiva >= 0) {
        e.preventDefault(); elegirSugerencia(lis[sugActiva]);
      } else if (e.key === 'Escape') cerrarSugerencias();
    });
    lista.addEventListener('mousedown', (e) => {
      const li = e.target.closest('li'); if (li) { e.preventDefault(); elegirSugerencia(li); }
    });
    document.addEventListener('click', (e) => { if (!e.target.closest('.combo')) cerrarSugerencias(); });

    // ---------- Etiquetas (chips) ----------
    function pintarChips() {
      chipsBox.innerHTML = ETIQUETAS.map(t =>
        `<button type="button" class="chip${seleccion.has(t) ? ' on' : ''}" data-tag="${esc(t)}" aria-pressed="${seleccion.has(t)}">${esc(t)}</button>`).join('');
      etiquetasHidden.value = [...seleccion].join(', ');
    }
    chipsBox.addEventListener('click', (e) => {
      const b = e.target.closest('.chip'); if (!b) return;
      const t = b.dataset.tag;
      seleccion.has(t) ? seleccion.delete(t) : seleccion.add(t);
      pintarChips();
    });

    // ---------- Fotos ----------
    const fotoHidden = $('foto'), fotoPrev = $('fotoPrev'), fotoFile = $('fotoFile'), btnQuitar = $('btnQuitarFoto');
    const pintarFoto = (el, src) => { el.innerHTML = src ? `<img src="${esc(src)}" alt="Vista previa">` : '<span>Sin foto</span>'; };
    function setFoto(v) { fotoHidden.value = v; pintarFoto(fotoPrev, v); btnQuitar.hidden = !v; if (!v) fotoFile.value = ''; }

    // Reduce la imagen (máx. 480 px) para que pese poco en la base de datos
    function comprimirImagen(file, max = 480) {
      return new Promise((resolve, reject) => {
        if (!file.type.startsWith('image/')) return reject(new Error('El archivo debe ser una imagen'));
        const url = URL.createObjectURL(file), img = new Image();
        img.onload = () => {
          const k = Math.min(1, max / Math.max(img.width, img.height));
          const c = document.createElement('canvas');
          c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL('image/jpeg', 0.8));
        };
        img.onerror = () => reject(new Error('No se pudo leer la imagen'));
        img.src = url;
      });
    }
    fotoFile.addEventListener('change', async () => {
      if (!fotoFile.files[0]) return;
      try { setFoto(await comprimirImagen(fotoFile.files[0])); } catch (err) { toast(err.message, true); }
    });
    btnQuitar.addEventListener('click', () => setFoto(''));

    let editFoto = null;
    $('editFotoFile').addEventListener('change', async (e) => {
      if (!e.target.files[0]) return;
      try { editFoto = await comprimirImagen(e.target.files[0]); pintarFoto($('editFotoPrev'), editFoto); }
      catch (err) { toast(err.message, true); }
    });

    // ---------- ID automático ----------
    function setNextId() {
      const ids = inventario.map(z => Number(z._id)).filter(Number.isFinite);
      $('_id').value = ids.length ? Math.max(...ids) + 1 : 101;
    }

    // ---------- Datos ----------
    async function cargarZapatillas() {
      try {
        const res = await fetch(API);
        const datos = await res.json();
        inventario = Array.isArray(datos) ? datos : [];
      } catch { inventario = []; toast('No se pudo conectar con el servidor', true); }
      setNextId();
      pintarEstadisticas();
      pintarTabla();
    }

    function pintarEstadisticas() {
      $('statModelos').textContent = inventario.length;
      $('statPares').textContent = inventario.reduce((s, z) => s + (Number(z.stock) || 0), 0);
      $('statBajo').textContent = inventario.filter(z => Number(z.stock) <= 3).length;
    }

    function pintarTabla() {
      const q = buscarInput.value.trim().toLowerCase();
      const m = filtroMarca.value;
      const datos = inventario.filter(z =>
        (!q || String(z.modelo).toLowerCase().includes(q)) &&
        (!m || (z.detalles?.marca ?? '') === m));

      if (!datos.length) {
        tbody.innerHTML = `<tr><td colspan="8" class="empty">${inventario.length ? 'Ninguna zapatilla coincide con tu búsqueda.' : 'Aún no hay zapatillas. Registra la primera arriba.'}</td></tr>`;
        return;
      }
      tbody.innerHTML = datos.map(z => {
        const stock = Number(z.stock);
        const nivel = stock <= 0 ? 'out' : stock <= 3 ? 'low' : 'ok';
        const tags = (Array.isArray(z.etiquetas) ? z.etiquetas : []).map(t => `<span class="tag">${esc(t)}</span>`).join('');
        return `
          <tr>
            <td class="muted">${esc(z._id)}</td>
            <td><div class="modelo-cell"><span class="thumb">${z.foto ? `<img src="${esc(z.foto)}" alt="${esc(z.modelo)}">` : zapatoSVG(z.detalles?.marca)}</span><strong>${esc(z.modelo)}</strong></div></td>
            <td>${esc(z.detalles?.marca)}</td>
            <td>${esc(z.detalles?.talla)}</td>
            <td>${esc(z.precio)}</td>
            <td><span class="stock ${nivel}">${stock}</span></td>
            <td><div class="tags">${tags}</div></td>
            <td><div class="ops">
              <button class="btn btn-small btn-edit" data-accion="editar" data-id="${esc(z._id)}">Editar</button>
              <button class="btn btn-small btn-del" data-accion="eliminar" data-id="${esc(z._id)}">Eliminar</button>
            </div></td>
          </tr>`;
      }).join('');
    }

    buscarInput.addEventListener('input', pintarTabla);
    filtroMarca.addEventListener('change', pintarTabla);

    // ---------- Crear ----------
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (!marcaHidden.value) { toast('Elige una marca', true); marcaSelect.focus(); return; }
      const body = Object.fromEntries(new FormData(form).entries());
      delete body.marcaSelect;
      try {
        const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
        const data = await res.json();
        if (!res.ok) return toast(data.error || 'No se pudo guardar la zapatilla', true);
        toast(data.mensaje || 'Zapatilla guardada');
        form.reset(); resetFormulario();
        cargarZapatillas();
      } catch { toast('No se pudo conectar con el servidor', true); }
    });
    function resetFormulario() { setFoto(''); setNextId(); seleccion.clear(); pintarChips(); setMarca(''); marcaSelect.selectedIndex = 0; cerrarSugerencias(); }
    $('btnReset').addEventListener('click', () => setTimeout(resetFormulario));

    // ---------- Editar / Eliminar ----------
    tbody.addEventListener('click', (e) => {
      const b = e.target.closest('button[data-accion]'); if (!b) return;
      const z = inventario.find(x => String(x._id) === b.dataset.id); if (!z) return;
      idActivo = z._id;
      if (b.dataset.accion === 'editar') {
        $('dlgNombre').textContent = `${z.modelo} · ID ${z._id}`;
        $('editPrecio').value = z.precio; $('editStock').value = z.stock;
        editFoto = null; $('editFotoFile').value = ''; pintarFoto($('editFotoPrev'), z.foto);
        $('dlgEditar').showModal();
      } else {
        $('delNombre').textContent = `Vas a eliminar "${z.modelo}" (ID ${z._id}). Esta acción no se puede deshacer.`;
        $('dlgEliminar').showModal();
      }
    });
    document.querySelectorAll('[data-cerrar]').forEach(b => b.addEventListener('click', () => b.closest('dialog').close()));

    $('formEditar').addEventListener('submit', async () => {
      try {
        const res = await fetch(`${API}/${idActivo}`, {
          method: 'PUT', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ precio: $('editPrecio').value, stock: $('editStock').value, ...(editFoto ? { foto: editFoto } : {}) })
        });
        const data = await res.json();
        if (!res.ok) return toast(data.error || 'No se pudo actualizar', true);
        toast(data.mensaje || 'Cambios guardados'); cargarZapatillas();
      } catch { toast('No se pudo conectar con el servidor', true); }
    });

    $('btnConfirmDel').addEventListener('click', async () => {
      try {
        const res = await fetch(`${API}/${idActivo}`, { method: 'DELETE' });
        const data = await res.json();
        if (!res.ok) return toast(data.error || 'No se pudo eliminar', true);
        toast(data.mensaje || 'Zapatilla eliminada'); cargarZapatillas();
      } catch { toast('No se pudo conectar con el servidor', true); }
    });

    // ---------- Inicio ----------
    initMarcas(); pintarChips(); setFoto(''); cargarZapatillas();
  </script>
</body>
</html>
